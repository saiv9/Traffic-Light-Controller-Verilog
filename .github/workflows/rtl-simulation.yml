name: Traffic Light Controller Simulation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  simulate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install simulation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog python3-matplotlib
      - name: Run testbench and render waveform
        run: bash ./scripts/run_sim.sh
      - name: Keep simulation outputs as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: traffic-light-controller-simulation
          path: docs/waveforms/
          if-no-files-found: error
      - name: Commit latest waveform files
        if: github.event_name != 'pull_request' && github.actor != 'github-actions[bot]'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/waveforms/*.png docs/waveforms/*.vcd docs/waveforms/*.log
          if git diff --cached --quiet; then
            echo "No waveform files changed."
          else
            git commit -m "Add simulation waveform output"
            git push
          fi
